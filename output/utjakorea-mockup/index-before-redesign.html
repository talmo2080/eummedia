<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>웃자대한민국협회 전체 시안</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #f7f3e8; }
    body { font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; color: #181510; }

    .page {
      position: relative;
      width: min(100%, 1440px);
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 0 40px rgba(77, 55, 12, 0.12);
    }

    .page-map {
      display: block;
      width: 100%;
      height: auto;
    }

    .mascot-wrap {
      position: absolute;
      z-index: 6;
      left: 79.5%;
      top: 17.72%;
      width: 22%;
      aspect-ratio: 1;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      filter: drop-shadow(0 18px 14px rgba(73, 49, 0, 0.26));
      transform-origin: 52% 72%;
      animation: mascotDance 4.2s cubic-bezier(0.45, 0, 0.25, 1) infinite;
      will-change: transform;
    }

    .mascot {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.08);
      animation: mascotBreathe 2.4s ease-in-out infinite alternate;
    }

    .ask-pill {
      position: absolute;
      left: auto;
      right: 58%;
      bottom: 11%;
      min-width: max-content;
      padding: 9px 15px;
      border: 2px solid #f1b600;
      border-radius: 999px;
      background: #fff;
      color: #282115;
      font-size: clamp(10px, 0.9vw, 14px);
      font-weight: 800;
      line-height: 1.25;
      box-shadow: 0 8px 18px rgba(72, 49, 0, 0.14);
      animation: askPulse 2.8s ease-in-out infinite;
    }

    .ask-pill::before {
      content: "";
      position: absolute;
      left: auto;
      right: -8px;
      top: 50%;
      width: 13px;
      height: 13px;
      border-top: 2px solid #f1b600;
      border-right: 2px solid #f1b600;
      background: #fff;
      transform: translateY(-50%) rotate(45deg);
    }

    .fee-card-redesign {
      position: absolute;
      z-index: 5;
      left: 67.4%;
      top: 20.08%;
      width: 27.5%;
      height: 3.15%;
      display: grid;
      grid-template-columns: 1fr;
      align-items: center;
      gap: 2%;
      padding: 0.35% 8.5% 0.35% 1.2%;
      overflow: visible;
      background: #fff;
    }

    .fee-copy strong {
      display: block;
      color: #e23b2f;
      font-size: clamp(18px, 2.05vw, 33px);
      line-height: 1.25;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .fee-copy { width: 62%; }

    .fee-copy span {
      display: block;
      margin-top: 15px;
      color: #948a78;
      font-size: clamp(9px, 0.95vw, 15px);
      line-height: 1.65;
      white-space: nowrap;
    }

    .fee-bot {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      filter: drop-shadow(0 9px 10px rgba(78, 48, 0, 0.2));
      animation: botBounce 1.8s ease-in-out infinite;
    }

    .fee-bot video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .fee-bot-label {
      position: absolute;
      right: -2%;
      top: -13%;
      padding: 6px 10px;
      border-radius: 999px;
      background: #181510;
      color: #fff;
      font-size: clamp(8px, 0.72vw, 11px);
      font-weight: 800;
      line-height: 1.25;
      white-space: nowrap;
    }

    .chat-panel {
      position: fixed;
      z-index: 30;
      right: 24px;
      bottom: 24px;
      width: min(380px, calc(100vw - 32px));
      overflow: hidden;
      border: 1px solid #eadfbf;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(49, 36, 9, 0.28);
      opacity: 0;
      transform: translateY(18px) scale(0.97);
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .chat-panel.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      background: #f1b600;
    }

    .chat-header strong { font-size: 16px; line-height: 1.35; }
    .chat-header span { display: block; margin-top: 2px; font-size: 11px; line-height: 1.45; }
    .chat-close { border: 0; background: transparent; font-size: 25px; cursor: pointer; }

    .chat-messages {
      height: 240px;
      padding: 16px;
      overflow-y: auto;
      background: #fffdf8;
    }

    .message {
      width: fit-content;
      max-width: 86%;
      margin-bottom: 10px;
      padding: 10px 13px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.65;
      white-space: pre-line;
    }

    .message.bot { border-bottom-left-radius: 4px; background: #f3eddf; }
    .message.user { margin-left: auto; border-bottom-right-radius: 4px; background: #f1b600; }

    .quick-questions {
      display: flex;
      gap: 6px;
      padding: 0 14px 12px;
      overflow-x: auto;
      background: #fffdf8;
    }

    .quick-questions button {
      flex: 0 0 auto;
      padding: 7px 10px;
      border: 1px solid #dccb9f;
      border-radius: 999px;
      background: #fff;
      font-size: 11px;
      cursor: pointer;
    }

    .chat-form { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 12px; border-top: 1px solid #eee6d5; }
    .chat-form input { min-width: 0; padding: 11px 12px; border: 1px solid #d8ccb0; border-radius: 10px; font-size: 13px; }
    .chat-form button { padding: 0 16px; border: 0; border-radius: 10px; background: #19150d; color: #fff; font-weight: 800; cursor: pointer; }

    .hero-carousel-ui {
      position: absolute;
      z-index: 5;
      top: 1.98%;
      left: 0;
      width: 100%;
      height: 16.45%;
      pointer-events: none;
    }

    .slide-arrow {
      position: absolute;
      top: 50%;
      width: clamp(34px, 4vw, 58px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      background: rgba(17, 14, 8, 0.42);
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: clamp(23px, 3vw, 42px);
      line-height: 1;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
      transform: translateY(-50%);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
      pointer-events: auto;
      cursor: pointer;
    }

    .slide-arrow:hover { background: rgba(17, 14, 8, 0.68); }
    .slide-arrow.prev { left: 2.2%; }
    .slide-arrow.next { right: 2.2%; }

    .slide-dots {
      position: absolute;
      left: 50%;
      bottom: 3.2%;
      display: flex;
      align-items: center;
      gap: clamp(7px, 0.9vw, 13px);
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(20, 17, 10, 0.4);
      backdrop-filter: blur(4px);
      transform: translateX(-50%);
      pointer-events: auto;
    }

    .slide-dot {
      width: clamp(7px, 0.75vw, 11px);
      aspect-ratio: 1;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      cursor: pointer;
      transition: width 180ms ease, background 180ms ease;
    }

    .slide-dot.active {
      width: clamp(22px, 2vw, 30px);
      border-radius: 999px;
      background: #f1b600;
    }

    .profile-redesign {
      position: absolute;
      z-index: 3;
      left: 4.35%;
      top: 55.15%;
      width: 91.3%;
      height: 10.7%;
      padding: 3.2% 3.5%;
      display: grid;
      grid-template-columns: 25% 33% 1fr;
      gap: 3%;
      align-items: center;
      overflow: hidden;
      border: 1px solid #eee5ce;
      border-radius: 24px;
      background: #fbf7eb;
    }

    .profile-redesign::after {
      content: "";
      position: absolute;
      right: -5%;
      top: -24%;
      width: 31%;
      aspect-ratio: 1;
      border: 2px solid rgba(240, 169, 0, 0.17);
      border-radius: 50%;
    }

    .youtube-thumb-replacement {
      position: absolute;
      z-index: 4;
      left: 4.35%;
      top: 76.69%;
      width: 43.75%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 24px;
      background: #111;
      box-shadow: 0 18px 34px rgba(52, 39, 12, 0.2);
    }

    .activity-image {
      position: absolute;
      z-index: 4;
      top: 48.16%;
      width: 29.2%;
      height: 4.66%;
      overflow: hidden;
      border-radius: 22px 22px 0 0;
      background: #eee7d7;
    }

    .activity-image.life { left: 35.4%; }
    .activity-image.market { left: 66.35%; }

    .activity-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .history-box-cleanup {
      position: absolute;
      z-index: 3;
      left: 39.4%;
      top: 39.15%;
      width: 56.2%;
      height: 5.3%;
      background: #fffdf8;
      pointer-events: none;
    }

    .history-photo {
      position: absolute;
      z-index: 4;
      left: 46.9%;
      top: 37.65%;
      width: 41.5%;
      aspect-ratio: 848 / 518;
      overflow: hidden;
      border: 1px solid #eee4cd;
      border-radius: 24px;
      background: #eee7d7;
      box-shadow: 0 18px 34px rgba(71, 50, 10, 0.15);
    }

    .history-photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .feature-icon {
      position: absolute;
      z-index: 5;
      top: 28.35%;
      width: 6%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 3px solid rgba(255, 255, 255, 0.88);
      border-radius: 50%;
      font-size: clamp(21px, 3vw, 43px);
      line-height: 1;
      box-shadow: 0 12px 24px rgba(67, 47, 10, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.6);
      animation: iconFloat 3s ease-in-out infinite;
      pointer-events: none;
    }

    .feature-icon.music {
      left: 47%;
      background: linear-gradient(145deg, #ff785a, #f1b600);
    }

    .feature-icon.healing {
      left: 65.65%;
      background: linear-gradient(145deg, #55c8b3, #ffd34f);
      animation-delay: -1s;
    }

    .feature-icon.meeting {
      left: 84.3%;
      background: linear-gradient(145deg, #68a8ff, #ff8d88);
      animation-delay: -2s;
    }

    @keyframes iconFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.04); }
    }

    .legacy-chat-cleanup {
      position: absolute;
      z-index: 4;
      pointer-events: none;
    }

    .legacy-chat-cleanup.bubble {
      left: 75.3%;
      top: 94.35%;
      width: 15.5%;
      height: 1.9%;
      background: #fefdf8;
    }

    .legacy-chat-cleanup.image-card {
      left: 88.8%;
      top: 93.42%;
      width: 6.8%;
      height: 1.28%;
      background: #fff;
      border-radius: 0 0 22px 0;
    }

    .legacy-chat-cleanup.image-outside {
      left: 88.8%;
      top: 94.68%;
      width: 10.2%;
      height: 1.58%;
      background: #fefdf8;
    }

    .partner-card-border-restore {
      position: absolute;
      z-index: 5;
      left: 73.9%;
      top: 89.02%;
      width: 21.7%;
      height: 5.66%;
      border: 1px solid #eee7d9;
      border-radius: 22px;
      pointer-events: none;
    }

    .footer-phone-replacement {
      position: absolute;
      z-index: 6;
      left: 31.9%;
      top: 97.95%;
      width: 18%;
      padding: 5px 0 7px;
      background: #fff;
      color: #1c1915;
      font-size: clamp(13px, 1.8vw, 27px);
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .youtube-thumb-replacement img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 220ms ease;
    }

    .youtube-thumb-replacement:hover img { transform: scale(1.025); }

    .youtube-play {
      position: absolute;
      left: 50%;
      top: 50%;
      width: clamp(58px, 7vw, 96px);
      aspect-ratio: 1.45;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: #ff0000;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.3);
      transform: translate(-50%, -50%);
    }

    .youtube-play::after {
      content: "";
      width: 0;
      height: 0;
      margin-left: 6%;
      border-top: clamp(10px, 1.25vw, 17px) solid transparent;
      border-bottom: clamp(10px, 1.25vw, 17px) solid transparent;
      border-left: clamp(17px, 2vw, 28px) solid #fff;
    }

    @keyframes mascotDance {
      0%, 100% { transform: translateY(0) rotate(-2deg) scale(1); }
      25% { transform: translateY(-8px) rotate(1.5deg) scale(1.02); }
      50% { transform: translateY(-14px) rotate(3deg) scale(1.045); }
      75% { transform: translateY(-7px) rotate(-0.5deg) scale(1.02); }
    }

    @keyframes mascotBreathe {
      from { transform: scale(1.06); }
      to { transform: scale(1.1); }
    }

    @keyframes askPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 8px 18px rgba(72, 49, 0, 0.14); }
      50% { transform: scale(1.045); box-shadow: 0 11px 24px rgba(241, 182, 0, 0.28); }
    }

    @keyframes botBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.04); }
    }

    .portrait-shell {
      position: relative;
      align-self: stretch;
      overflow: hidden;
      border-radius: 18px;
      background: #f0c44b;
      box-shadow: 0 15px 28px rgba(98, 65, 0, 0.18);
    }

    .portrait-shell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 24%;
    }

    .portrait-badge {
      position: absolute;
      left: 14px;
      bottom: 14px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(18, 17, 13, 0.84);
      color: #fff;
      font-size: clamp(9px, 0.85vw, 14px);
      font-weight: 700;
    }

    .eyebrow {
      margin: 0 0 11px;
      color: #b88700;
      font-size: clamp(10px, 0.9vw, 14px);
      font-weight: 800;
      letter-spacing: 0;
    }

    .profile-copy h2 {
      margin: 0;
      font-size: clamp(21px, 2.2vw, 36px);
      line-height: 1.15;
      letter-spacing: 0;
    }

    .profile-copy h2 span {
      display: block;
      margin-top: 8px;
      color: #d99d00;
      font-size: 0.62em;
    }

    .profile-copy p {
      margin: 20px 0 0;
      color: #6f6656;
      font-size: clamp(10px, 0.95vw, 15px);
      line-height: 1.75;
    }

    .quote-card {
      position: relative;
      z-index: 1;
      padding: 9% 8%;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 12px 28px rgba(91, 70, 20, 0.08);
    }

    .mission-copy {
      margin: 12px 0 0;
      font-size: clamp(14px, 1.45vw, 23px);
      font-weight: 800;
      line-height: 1.55;
    }

    @media (max-width: 700px) {
      .mascot-wrap { left: 77%; top: 17.82%; width: 24%; }
      .ask-pill { right: 50%; bottom: 6%; padding: 4px 7px; }
      .fee-card-redesign { left: 66%; width: 31%; grid-template-columns: 1fr 38%; }
      .fee-copy span { margin-top: 4px; }
      .fee-bot-label { display: none; }
      .chat-panel { right: 16px; bottom: 16px; }

      .profile-redesign {
        grid-template-columns: 31% 1fr;
        gap: 4%;
        padding: 3%;
      }

      .quote-card { display: none; }
      .profile-copy p { margin-top: 8px; line-height: 1.45; }
      .portrait-badge { left: 5px; bottom: 5px; padding: 3px 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .mascot-wrap, .mascot, .ask-pill, .fee-bot { animation: none; }
    }

  </style>
</head>
<body>
  <main class="page" aria-label="웃자대한민국협회 전체 홈페이지 시안">
    <img class="page-map" src="assets/full-mockup.png" alt="웃자대한민국협회 전체 홈페이지 시안" />

    <div class="hero-carousel-ui" aria-label="헤더 사진 슬라이드 6장">
      <button class="slide-arrow prev" type="button" aria-label="이전 사진">&#8249;</button>
      <button class="slide-arrow next" type="button" aria-label="다음 사진">&#8250;</button>
      <div class="slide-dots" aria-label="사진 순서">
        <button class="slide-dot active" type="button" aria-label="1번 사진"></button>
        <button class="slide-dot" type="button" aria-label="2번 사진"></button>
        <button class="slide-dot" type="button" aria-label="3번 사진"></button>
        <button class="slide-dot" type="button" aria-label="4번 사진"></button>
        <button class="slide-dot" type="button" aria-label="5번 사진"></button>
        <button class="slide-dot" type="button" aria-label="6번 사진"></button>
      </div>
    </div>

    <button class="mascot-wrap js-open-chat" type="button" aria-label="웃자 AI에게 질문하기">
      <video class="mascot" autoplay loop muted playsinline>
        <source src="assets/mascot.webm" type="video/webm" />
      </video>
      <span class="ask-pill">뭐든 물어보세요!</span>
    </button>

    <section class="fee-card-redesign" aria-label="참가비와 AI 질문 안내">
      <div class="fee-copy">
        <strong>참가비 마음만!</strong>
        <span>누구에게나 열린 따뜻한 자리</span>
      </div>
    </section>

    <div class="activity-image life" aria-label="찾아가는 인생다방 이미지">
      <img src="assets/life-cafe.png" alt="찾아가는 인생다방 종암동 양주상회 방문" />
    </div>
    <div class="activity-image market" aria-label="시장과 지역 이미지">
      <img src="assets/market-local.png" alt="시장과 지역에서 함께 웃는 사람들" />
    </div>

    <div class="history-box-cleanup" aria-hidden="true"></div>
    <div class="history-photo" aria-label="12년 동안 함께한 나비축제 현장">
      <img src="assets/twelve-years-photo.png" alt="싱글벙글 나비축제에서 함께 축하하는 참가자들" />
    </div>

    <div class="feature-icon music" role="img" aria-label="노래와 문화">&#127908;</div>
    <div class="feature-icon healing" role="img" aria-label="웃음 치유">&#128516;</div>
    <div class="feature-icon meeting" role="img" aria-label="열린 만남">&#129309;</div>

    <section class="profile-redesign" aria-label="협회장 소개">
      <div class="portrait-shell">
        <img src="assets/seong-changwoon.jpg" alt="웃자대한민국협회장 성창운" />
        <div class="portrait-badge">웃자대한민국협회장</div>
      </div>

      <div class="profile-copy">
        <p class="eyebrow">협회장 소개</p>
        <h2>성창운<span>웃자대한민국협회장</span></h2>
        <p>
          웃음과 소통으로 사람을 연결하며,<br />
          누구나 함께 웃는 따뜻한 공동체를 만들어갑니다.
        </p>
      </div>

      <div class="quote-card">
        <p class="eyebrow">함께 만드는 변화</p>
        <p class="mission-copy">
          웃음은 사람과 사람을 잇고,<br />
          공동체를 다시 일으키는 힘입니다.
        </p>
      </div>
    </section>

    <a
      class="youtube-thumb-replacement"
      href="https://youtu.be/KqcezELSLrs?si=M75YiPtvxrlshpCH"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="웃자대한민국 노래 유튜브에서 보기"
    >
      <img src="assets/youtube-song.png" alt="웃자대한민국 노래 뮤직비디오" />
      <span class="youtube-play" aria-hidden="true"></span>
    </a>

    <div class="legacy-chat-cleanup bubble" aria-hidden="true"></div>
    <div class="legacy-chat-cleanup image-card" aria-hidden="true"></div>
    <div class="legacy-chat-cleanup image-outside" aria-hidden="true"></div>
    <div class="partner-card-border-restore" aria-hidden="true"></div>
    <div class="footer-phone-replacement" aria-label="대표 전화번호 02-6956-0339">02-6956-0339</div>
  </main>

  <aside class="chat-panel" aria-label="웃자 AI 대화창" aria-hidden="true">
    <div class="chat-header">
      <div>
        <strong>웃자 AI</strong>
        <span>웃자대한민국협회에 대해 물어보세요</span>
      </div>
      <button class="chat-close" type="button" aria-label="대화창 닫기">&times;</button>
    </div>
    <div class="chat-messages" aria-live="polite">
      <div class="message bot">안녕하세요! 웃자 AI입니다.<br />일정, 장소, 참가비, 참여 방법을 물어보세요.</div>
    </div>
    <div class="quick-questions" aria-label="빠른 질문">
      <button type="button">언제 열리나요?</button>
      <button type="button">어디에서 하나요?</button>
      <button type="button">참가비가 있나요?</button>
    </div>
    <form class="chat-form">
      <input type="text" aria-label="질문 입력" placeholder="궁금한 내용을 입력하세요" />
      <button type="submit">전송</button>
    </form>
  </aside>
  <script>
    const dots = [...document.querySelectorAll('.slide-dot')]
    const previous = document.querySelector('.slide-arrow.prev')
    const next = document.querySelector('.slide-arrow.next')
    let activeSlide = 0

    const showSlide = (index) => {
      activeSlide = (index + dots.length) % dots.length
      dots.forEach((dot, dotIndex) => dot.classList.toggle('active', dotIndex === activeSlide))
    }

    previous.addEventListener('click', () => showSlide(activeSlide - 1))
    next.addEventListener('click', () => showSlide(activeSlide + 1))
    dots.forEach((dot, index) => dot.addEventListener('click', () => showSlide(index)))
    window.setInterval(() => showSlide(activeSlide + 1), 2800)

    const chatPanel = document.querySelector('.chat-panel')
    const chatMessages = document.querySelector('.chat-messages')
    const chatInput = document.querySelector('.chat-form input')
    const mascotVideo = document.querySelector('.mascot')

    const keepMascotMoving = () => {
      if (!mascotVideo) return
      mascotVideo.playbackRate = 0.55
      if (mascotVideo.paused) mascotVideo.play().catch(() => {})
    }
    keepMascotMoving()
    document.addEventListener('visibilitychange', keepMascotMoving)
    const openChat = () => {
      chatPanel.classList.add('open')
      chatPanel.setAttribute('aria-hidden', 'false')
      chatInput.focus()
    }
    const closeChat = () => {
      chatPanel.classList.remove('open')
      chatPanel.setAttribute('aria-hidden', 'true')
    }

    document.querySelectorAll('.js-open-chat').forEach((button) => button.addEventListener('click', openChat))
    document.querySelector('.chat-close').addEventListener('click', closeChat)

    const answerFor = (question) => {
      if (/언제|시간|요일/.test(question)) return '모임은 매주 월요일 저녁 7시에 열립니다.'
      if (/어디|장소|위치/.test(question)) return '서울 관악구 남부순환로 1699, 2층에서 만나요.'
      if (/참가비|비용|얼마/.test(question)) return '참가비는 마음만! 누구에게나 열린 따뜻한 자리입니다.'
      if (/문의|전화|연락/.test(question)) return '대표 전화는 02-6956-0339입니다.'
      return '좋은 질문이에요. 현재 시안에서는 기본 안내를 제공하고 있습니다. 실제 AI 연결 시 더 자세히 답변드릴게요.'
    }

    const sendQuestion = (question) => {
      const cleanQuestion = question.trim()
      if (!cleanQuestion) return
      const userMessage = document.createElement('div')
      userMessage.className = 'message user'
      userMessage.textContent = cleanQuestion
      chatMessages.appendChild(userMessage)

      const botMessage = document.createElement('div')
      botMessage.className = 'message bot'
      botMessage.textContent = answerFor(cleanQuestion)
      chatMessages.appendChild(botMessage)
      chatMessages.scrollTop = chatMessages.scrollHeight
    }

    document.querySelector('.chat-form').addEventListener('submit', (event) => {
      event.preventDefault()
      sendQuestion(chatInput.value)
      chatInput.value = ''
      chatInput.focus()
    })

    document.querySelectorAll('.quick-questions button').forEach((button) => {
      button.addEventListener('click', () => sendQuestion(button.textContent))
    })
  </script>
</body>
</html>
